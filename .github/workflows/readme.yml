# Manual trigger only for now; add a push trigger once the generated layout is settled.
name: Generate README

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate contents section
        run: python3 scripts/generate-readme.py

      - name: Commit changed README
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md: unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): regenerate contents"
          git push
