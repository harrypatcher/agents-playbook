# Manual trigger only: a release is a deliberate publish step, not a side effect of every push.
name: Release Skills

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Calls the script directly instead of `bun run package` so the runner needs no Bun setup step.
            - name: Package skills
              run: python3 scripts/package-skills.py

            # The package.json version is the release version; reusing an existing tag fails instead of overwriting a release.
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="v$(jq -r .version package.json)"
                  if gh release view "$tag" >/dev/null 2>&1; then
                    echo "release $tag already exists; bump version in package.json" >&2
                    exit 1
                  fi
                  gh release create "$tag" dist/release-skills.zip \
                    --target "$GITHUB_SHA" \
                    --title "Skills $tag" \
                    --notes "Extract release-skills.zip, then upload each skill ZIP in Claude under Customize > Skills > Upload a skill."
