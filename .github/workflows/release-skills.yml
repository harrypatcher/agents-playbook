# Manual trigger only: a release is a deliberate publish step, not a side effect of every push.
name: Release Skills

on:
    workflow_dispatch:

permissions:
    contents: write

# Queue instead of cancel: two parallel runs would race on the same tag, and a cancelled run could leave a partial release.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    release:
        # The 1-vCPU container runner starts faster than a full VM and ships python3, jq, and gh.
        runs-on: ubuntu-slim
        timeout-minutes: 5
        steps:
            # gh authenticates through GH_TOKEN, so the checkout needs no persisted push credentials.
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # Calls the script directly instead of `bun run package` so the runner needs no Bun setup step.
            - name: Package skills
              run: python3 scripts/package-skills.py

            # The package.json version is the release version; reusing an existing tag fails instead of overwriting a release.
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="v$(jq -r .version package.json)"
                  if gh release view "$tag" >/dev/null 2>&1; then
                    echo "release $tag already exists; bump version in package.json" >&2
                    exit 1
                  fi
                  gh release create "$tag" dist/release-skills.zip \
                    --target "$GITHUB_SHA" \
                    --title "Skills $tag" \
                    --notes "Extract release-skills.zip, then add each Markdown file from release-skills/ in Claude under Customize > Skills."
